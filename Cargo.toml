[package]
name = "cutrace"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name         = "cutrace"
crate-type   = ["rlib", "cdylib"]

[dependencies]
libc = "0.2.150"
cudarc = { version="0.9.16", features=["std", "driver", "runtime", "nvrtc"], default-features = false }
once_cell = "1.19.0"
colored = "2.1.0"

[patch.crates-io]
cudarc = { git = "https://github.com/atomicapple0/cudarc.git" }
